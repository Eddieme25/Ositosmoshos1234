<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Aniversario, Osita Mosha ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería de Confeti Canvas -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Overpass:wght@400;600;700;800&display=swap');
        
        :root {
            --back-in-black: #16131F;
            --mountain-heather: #F0D9E4;
            --decanting: #C1A0AC;
            --funkie-friday: #4A3F4B;
            --moonscape: #806C79;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Andika', sans-serif;
            background-color: var(--back-in-black);
            color: var(--mountain-heather);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        .font-cormorant { font-family: 'Cormorant Garamond', serif; }
        .font-overpass { font-family: 'Overpass', sans-serif; }
        .font-andika { font-family: 'Andika', sans-serif; }

        /* --- FONDO AESTHETIC --- */
        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(193, 160, 172, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(74, 63, 75, 0.25) 0%, transparent 50%);
        }

        /* --- ESTELA DE BRILLOS Y2K EN EL CURSOR --- */
        .sparkle-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 14px;
            color: var(--mountain-heather);
            text-shadow: 0 0 8px var(--decanting);
            animation: fadeAndScale 0.8s forwards ease-out;
        }

        @keyframes fadeAndScale {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -15px) scale(0.3) rotate(45deg);
            }
        }

        /* --- INTRO: CORAZÓN EN MULTI-IDIOMAS --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--back-in-black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            padding: 1rem;
        }

        #heart-container {
            position: relative;
            width: 100%;
            max-width: 550px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .love-word {
            position: absolute;
            font-family: 'Overpass', sans-serif;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.3);
            animation: fadeInWord 0.8s forwards ease-out;
            text-shadow: 0 0 10px rgba(240, 217, 228, 0.3);
        }

        .love-word.center-phrase {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem !important;
            font-style: italic;
            font-weight: 600 !important;
            color: var(--mountain-heather) !important;
            text-shadow: 0 0 20px rgba(240, 217, 228, 0.8), 0 0 35px var(--decanting) !important;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .love-word.center-phrase {
                font-size: 1.8rem !important;
            }
        }

        @keyframes fadeInWord {
            to {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .heart-pulse {
            animation: pulseHeart 2.5s infinite ease-in-out alternate;
        }

        @keyframes pulseHeart {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.04); }
        }

        .btn-continue {
            margin-top: 24px;
            padding: 14px 40px;
            font-family: 'Overpass', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--back-in-black);
            background: linear-gradient(135deg, var(--mountain-heather), var(--decanting));
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(193, 160, 172, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease, transform 0.2s;
        }

        .btn-continue.show {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-continue:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 40px rgba(240, 217, 228, 0.6);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        #main-content {
            opacity: 0;
            position: relative;
            z-index: 1;
            transition: opacity 1.5s ease;
        }

        .card-glow {
            background: rgba(74, 63, 75, 0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(193, 160, 172, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-glow:hover:not(.locked) {
            transform: translateY(-6px);
            background: rgba(74, 63, 75, 0.55);
            border-color: rgba(240, 217, 228, 0.5);
            box-shadow: 0 15px 35px -5px rgba(193, 160, 172, 0.25);
        }

        .symbol-badge {
            font-family: 'Cormorant Garamond', serif;
            color: var(--mountain-heather);
            text-shadow: 0 0 15px rgba(240, 217, 228, 0.4);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--back-in-black); }
        ::-webkit-scrollbar-thumb { background: var(--funkie-friday); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--moonscape); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between font-andika">

    <div class="ambient-bg"></div>

    <!-- INTRO CORAZÓN DE PALABRAS -->
    <div id="intro-screen">
        <div id="heart-container"></div>
        <button id="continue-btn" class="btn-continue">EMPEZAR RECORRIDO ✦</button>
    </div>

    <!-- PANTALLA PRINCIPAL CON REGALOS -->
    <div id="main-content" class="w-full flex-1 flex flex-col items-center p-4 md:p-8">
        
        <header class="text-center my-6 max-w-2xl px-2">
            <h1 class="font-cormorant text-3xl sm:text-5xl md:text-6xl font-bold italic text-transparent bg-clip-text bg-gradient-to-r from-[#F0D9E4] via-[#C1A0AC] to-[#F0D9E4] mb-2 tracking-wide leading-tight">
                Feliz Aniversario, Osita Mosha
            </h1>
            <p class="font-andika text-[#C1A0AC]/90 text-xs sm:text-sm md:text-base font-normal tracking-wide">
                Cada segundo a tu lado es mi momento favorito ✦
            </p>
        </header>

        <!-- Contador de Tiempo -->
        <section class="w-full max-w-2xl bg-[#4A3F4B]/25 border border-[#806C79]/30 rounded-3xl p-4 sm:p-6 shadow-2xl backdrop-blur-md mb-8">
            <div class="grid grid-cols-4 gap-1 sm:gap-2 text-center">
                <div class="p-1 sm:p-2">
                    <span id="days" class="font-overpass text-2xl sm:text-4xl md:text-5xl font-extrabold text-[#F0D9E4]">0</span>
                    <p class="font-overpass text-[10px] sm:text-[11px] uppercase tracking-widest text-[#C1A0AC]/80 font-bold mt-1 sm:mt-2">Días</p>
                </div>
                <div class="p-1 sm:p-2">
                    <span id="hours" class="font-overpass text-2xl sm:text-4xl md:text-5xl font-extrabold text-[#F0D9E4]">0</span>
                    <p class="font-overpass text-[10px] sm:text-[11px] uppercase tracking-widest text-[#C1A0AC]/80 font-bold mt-1 sm:mt-2">Horas</p>
                </div>
                <div class="p-1 sm:p-2">
                    <span id="minutes" class="font-overpass text-2xl sm:text-4xl md:text-5xl font-extrabold text-[#F0D9E4]">0</span>
                    <p class="font-overpass text-[10px] sm:text-[11px] uppercase tracking-widest text-[#C1A0AC]/80 font-bold mt-1 sm:mt-2">Minutos</p>
                </div>
                <div class="p-1 sm:p-2">
                    <span id="seconds" class="font-overpass text-2xl sm:text-4xl md:text-5xl font-extrabold text-[#F0D9E4]">0</span>
                    <p class="font-overpass text-[10px] sm:text-[11px] uppercase tracking-widest text-[#C1A0AC]/80 font-bold mt-1 sm:mt-2">Segundos</p>
                </div>
            </div>
        </section>

        <!-- Subtítulo -->
        <div class="text-center mb-6 sm:mb-8">
            <h2 class="font-cormorant text-xl sm:text-2xl md:text-3xl font-bold italic text-[#F0D9E4] tracking-wide">Nuestra Semana de Sorpresas ✦</h2>
            <p class="font-andika text-[11px] sm:text-xs text-[#806C79] mt-1 font-normal tracking-wider">Un detalle especial para cada día de nuestra semana de aniversario</p>
        </div>

        <!-- Grid de 7 Regalos -->
        <main id="gifts-grid" class="w-full max-w-4xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 mb-16">
            <!-- Generado dinámicamente -->
        </main>
    </div>

    <!-- Modal para Mostrar la Sorpresa -->
    <div id="gift-modal" class="fixed inset-0 bg-[#16131F]/85 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-[#4A3F4B]/95 border border-[#806C79]/50 rounded-3xl p-6 md:p-8 max-w-md w-full text-center relative shadow-2xl max-h-[90vh] overflow-y-auto backdrop-blur-lg">
            <button id="close-modal" class="absolute top-5 right-5 text-[#C1A0AC] hover:text-[#F0D9E4] text-xl transition z-10 font-overpass p-2">
                ✕
            </button>
            
            <div id="modal-icon" class="symbol-badge text-4xl italic font-bold mb-3">✦</div>
            <h3 id="modal-title" class="font-cormorant text-2xl md:text-3xl font-bold italic text-[#F0D9E4] mb-1"></h3>
            <p id="modal-date" class="font-overpass text-[10px] text-[#C1A0AC] uppercase font-extrabold tracking-widest mb-5"></p>
            
            <div id="modal-body" class="font-andika text-[#F0D9E4]/90 text-sm leading-relaxed mb-6"></div>
            
            <button id="modal-btn" class="font-overpass w-full bg-gradient-to-r from-[#C1A0AC] to-[#806C79] text-[#16131F] font-extrabold tracking-wider py-3.5 rounded-2xl shadow-xl hover:opacity-95 transition transform hover:-translate-y-0.5">
                TE AMO ✦
            </button>
        </div>
    </div>

    <script>
        // --- EFECTO DE DESTELLES Y2K EN EL CURSOR ---
        const sparkleSymbols = ['✦', '✧', '★', '⋄'];
        let lastSparkleTime = 0;

        document.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastSparkleTime > 45) {
                lastSparkleTime = now;
                const sparkle = document.createElement('span');
                sparkle.className = 'sparkle-trail';
                sparkle.innerText = sparkleSymbols[Math.floor(Math.random() * sparkleSymbols.length)];
                sparkle.style.left = `${e.clientX}px`;
                sparkle.style.top = `${e.clientY}px`;
                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 800);
            }
        });

        // --- FUNCIÓN DE CONFETI CON PALETA PERSONALIZADA ---
        function triggerConfetti() {
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.7 },
                colors: ['#F0D9E4', '#C1A0AC', '#806C79', '#ffffff']
            });
        }

        // --- 1. INTRO CORAZÓN EN MULTI-IDIOMAS ---
        const loveWords = [
            "TE AMO", "I Love You", "Je t'aime", "Ti amo", "Ich liebe dich", 
            "Eu te amo", "Saranghae", "Aishiteru", "Ya tebya lyublyu", "S'agapo", 
            "Mahal kita", "Aku cinta kamu", "Te quiero", "Wo ai ni", "Ina xurrke",
            "Te adoro", "Mi vida", "Mi todo", "Eres mi mundo", "Siempre juntos",
            "TE AMO", "I Love You", "Je t'aime", "Ti amo", "Ich liebe dich",
            "Eu te amo", "Saranghae", "Aishiteru", "Ya tebya lyublyu", "S'agapo"
        ];

        const heartContainer = document.getElementById('heart-container');
        const continueBtn = document.getElementById('continue-btn');

        function createHeart() {
            const centerSpan = document.createElement('span');
            centerSpan.className = 'love-word center-phrase';
            centerSpan.innerText = 'Para mi linda osita Dani';
            
            const isMobile = window.innerWidth < 640;
            const centerX = isMobile ? (heartContainer.clientWidth / 2) : 275;
            const centerY = isMobile ? 210 : 230;
            
            centerSpan.style.left = `${centerX}px`;
            centerSpan.style.top = `${centerY}px`;
            heartContainer.appendChild(centerSpan);

            const totalWords = loveWords.length;
            let current = 0;

            const interval = setInterval(() => {
                if (current >= totalWords) {
                    clearInterval(interval);
                    heartContainer.classList.add('heart-pulse');
                    continueBtn.classList.add('show');
                    return;
                }

                const t = (current / totalWords) * Math.PI * 2;
                const scaleFactor = isMobile ? 11 : 15;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                const posX = x * scaleFactor + centerX;
                const posY = y * scaleFactor + (centerY - 10);

                const span = document.createElement('span');
                span.className = 'love-word';
                span.innerText = loveWords[current];
                span.style.fontSize = `${Math.random() * 0.2 + (isMobile ? 0.7 : 0.8)}rem`;
                span.style.color = `hsl(${Math.random() * 20 + 330}, 35%, ${Math.random() * 15 + 75}%)`;
                span.style.left = `${posX}px`;
                span.style.top = `${posY}px`;

                heartContainer.appendChild(span);
                current++;
            }, 100);
        }

        createHeart();

        continueBtn.addEventListener('click', () => {
            const intro = document.getElementById('intro-screen');
            const main = document.getElementById('main-content');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.visibility = 'hidden';
                main.style.opacity = '1';
                triggerConfetti();
            }, 1200);
        });

        // --- 2. CONTADOR DE TIEMPO (Iniciado 18 de Octubre de 2025) ---
        const startDate = new Date(2025, 9, 18, 0, 0, 0);

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // --- 3. DATOS DE LOS REGALOS (BLOQUEADO REAL SEGÚN FECHA) ---
        const gifts = [
            {
                id: 1,
                dayName: "Lunes 12",
                unlockDate: new Date(2026, 9, 12, 0, 0, 0),
                symbol: "𝒩° 𝟶𝟷",
                title: "Cupón válido para cita en el cine",
                type: "ticket",
                movie: "Tu Nombre (Your Name)",
                dateTime: "12 de Octubre, 07:00 PM",
                cinema: "Cine Diana",
                seats: "C-5, C-4 (Sala 5)",
                orderNum: "Orden 5196",
                qrCode: "WGFZZRF",
                message: "¡Iniciamos nuestra semana de aniversario celebrando con una cita muy especial! Vamos a ver una de las historias más hermosas. Prepárate para una semana llena de sorpresas."
            },
            {
                id: 2,
                dayName: "Martes 13",
                unlockDate: new Date(2026, 9, 13, 0, 0, 0),
                symbol: "♫",
                title: "Para mi Osita Mosha",
                type: "spotify",
                spotifyId: "0avG7UAV54O7TVfDGr4j5S",
                message: "Cada canción de esta lista me recuerda a ti, a nuestras risas y a los momentos más bonitos de nuestro primer año juntos. Escúchala hoy cuando pienses en mí."
            },
            {
                id: 3,
                dayName: "Miércoles 14",
                unlockDate: new Date(2026, 9, 14, 0, 0, 0),
                symbol: "⟡",
                title: "Cápsula del Tiempo",
                message: "Un recorrido por nuestros momentos más especiales, bonitos y divertidos de todo este año juntos. Eres lo mejor que me ha pasado."
            },
            {
                id: 4,
                dayName: "Jueves 15",
                unlockDate: new Date(2026, 9, 15, 0, 0, 0),
                symbol: "◈",
                title: "Un Detalle Especial",
                type: "coupon",
                couponCode: "OSITO-VIP-2026",
                couponSubtitle: "CUPÓN EXCLUSIVO",
                couponTitle: "Vale por un regalo especial",
                couponBody: "Presentar este cupón con General osito para entrega ✦",
                message: "Hoy que nos vemos tengo un regalito físico preparado especialmente para ti. Muestra esta pantalla para recibir tu caja."
            },
            {
                id: 5,
                dayName: "Viernes 16",
                unlockDate: new Date(2026, 9, 16, 0, 0, 0),
                symbol: "✉",
                title: "La Noche Antes de Nuestro Aniversario",
                type: "letter",
                letterTitle: "Para el amor de mi vida:",
                letterBody: `No puedo creer lo rápido que se pasó este año a tu lado. Parece que fue ayer cuando te vi en la universidad y me enamoré de ti en ese mismo instante. Sé que a veces no crees en el amor a primera vista, pero yo desde ese preciso momento sabía que quería pasar mi vida a tu lado; sabía que eras tú la persona con quien quería construir mi camino. Y hoy, estamos a solo unas horas de cumplir oficialmente nuestro primer aniversario, mi osita bebé.<br><br>
                Te escribo esta cartita porque no aguantaba las ganas de decirte lo emocionado e ilusionado que estoy por todo lo que viene. Sé que a veces la rutina o el día a día nos llevan de prisa, y sé que ambos tenemos días difíciles y problemas, pero me llena de felicidad saber que, al final de todo, siempre de una u otra forma tú y yo lo resolvemos. Nos escuchamos, nos apoyamos y salimos adelante juntos. A pesar de cualquier tempestad, momentos como este me hacen detenerme, suspirar y agradecer profundamente al destino por tenerte en mi vida.<br><br>
                Mirar hacia atrás y ver todo lo que hemos compartido en estos 365 días me llena el corazón. Cada salida, cada llamada hasta tarde, cada abrazo cuando más lo necesitaba, cada risa compartida por la cosa más simple y cada mirada en la que no hacían falta las palabras... todo ha valido completamente la pena. Contigo he aprendido lo que realmente significa amar y sentirse amado sin reservas, con calma y con la certeza de que encontré mi lugar seguro en el mundo.<br><br>
                Gracias por cada detalle, por tu ternura, por aguantarme, por cuidarme y por ser mi compañera incondicional en todo este camino. Eres lo más bonito que me ha pasado y no cambiaría absolutamente nada de lo que hemos vivido juntos, porque cada instante nos ha traído hasta aquí, más fuertes y más unidos que nunca. Ambos tenemos muchísimos planes y sueños por cumplir, los cuales ansío con toda mi alma realizar, ya que a tu lado sé perfectamente que todo es posible.<br><br>
                Descansa muy rico hoy, mi vida. Prepárate para un fin de semana lleno de magia solo para nosotros dos, para celebrar este primer capítulo de muchos más que nos quedan por escribir.<br><br>
                Te amo con todo mi corazón, mi linda Osita.`,
                letterSign: "— Ed:die"
            },
            {
                id: 6,
                dayName: "Sábado 17",
                unlockDate: new Date(2026, 9, 17, 0, 0, 0),
                symbol: "⚜",
                title: "¡Nos Vamos de Cita!",
                type: "coupon",
                couponCode: "HELADITO-OSITO-2026",
                couponSubtitle: "CUPÓN DULCE",
                couponTitle: "Salida Especial ✦",
                couponBody: "Válido por un heladito con osito ✦",
                message: "¡Llegó el día! Presenta este cupón para ir por tu helado preferido y dar inicio a nuestra gran escapada."
            },
            {
                id: 7,
                dayName: "Domingo 18",
                unlockDate: new Date(2026, 9, 18, 0, 0, 0),
                symbol: "✦ 𝒳𝒪 ✦",
                title: "¡Feliz 1er Aniversario!",
                type: "letter",
                letterTitle: "¡Feliz 1er Aniversario, mi vida! ✦",
                letterBody: `Espero con todo mi corazón que hayas disfrutado muchísimo cada pequeña sorpresa de esta semana de aniversario. Preparar cada detalle para ti fue mi manera de recordarte lo ridículamente especial e importante que eres en mi vida.<br><br>
                Hoy cumplimos oficialmente nuestro primer año juntos, y no puedo evitar sentirme profundamente agradecido por haberte encontrado y por cada segundo que hemos compartido. Gracias por ser mi lugar seguro, por tus abrazos que curan todo, por las risas infinitas y por hacerme el hombre más feliz del mundo día con día.<br><br>
                Este primer año es solo el comienzo de toda una vida de aventuras, sueños compartidos y recuerdos hermosos por construir a tu lado. Eres y siempre serás mi persona favorita.<br><br>
                Te amo con todo mi corazón, hoy y siempre.`,
                letterSign: "— Tu General Osito 🧸❤️"
            }
        ];

        const grid = document.getElementById('gifts-grid');
        const modal = document.getElementById('gift-modal');

        function renderGifts() {
            const now = new Date();
            grid.innerHTML = '';

            gifts.forEach((gift) => {
                const isUnlocked = (now >= gift.unlockDate);
                
                const card = document.createElement('div');
                card.className = `card-glow cursor-pointer rounded-3xl p-6 border flex flex-col items-center justify-center text-center relative overflow-hidden ${
                    isUnlocked 
                    ? 'text-[#F0D9E4]' 
                    : 'bg-[#16131F]/80 border-[#4A3F4B]/40 opacity-50 locked text-[#806C79]'
                }`;

                card.innerHTML = `
                    <div class="font-overpass text-[10px] uppercase font-extrabold tracking-widest px-3.5 py-1 rounded-full mb-4 ${isUnlocked ? 'bg-[#806C79]/30 text-[#F0D9E4] border border-[#806C79]/20' : 'bg-[#16131F] text-[#806C79]'}">
                        ${gift.dayName}
                    </div>
                    <div class="symbol-badge text-3xl md:text-4xl italic font-bold my-2 tracking-wider ${isUnlocked ? '' : 'brightness-50'}">
                        ${isUnlocked ? gift.symbol : '🔒'}
                    </div>
                    <p class="font-andika text-[11px] font-normal tracking-wider uppercase mt-2 ${isUnlocked ? 'text-[#C1A0AC]' : 'text-[#806C79]' }">
                        ${isUnlocked ? 'Toca para abrir' : 'Bloqueado'}
                    </p>
                `;

                card.addEventListener('click', () => openGift(gift, isUnlocked));
                grid.appendChild(card);
            });
        }

        function openGift(gift, isUnlocked) {
            if (isUnlocked) {
                triggerConfetti();

                document.getElementById('modal-icon').innerText = gift.symbol;
                document.getElementById('modal-title').innerText = gift.title;
                document.getElementById('modal-date').innerText = gift.dayName + " - Regalo Desbloqueado";
                
                if (gift.type === "ticket") {
                    document.getElementById('modal-body').innerHTML = `
                        <p class="font-andika text-[#F0D9E4]/80 text-xs mb-4">${gift.message}</p>
                        <div class="bg-gradient-to-b from-[#16131F] via-[#4A3F4B]/60 to-[#16131F] border border-[#806C79]/40 rounded-2xl p-5 shadow-2xl text-left relative overflow-hidden my-3">
                            <div class="flex flex-col items-center mb-4 text-center">
                                <div class="bg-white p-3 rounded-2xl shadow-lg border border-slate-200">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${gift.qrCode}" alt="QR Ticket" class="w-28 h-28 object-contain">
                                    <p class="text-black font-mono font-bold text-xs mt-1 tracking-widest">${gift.qrCode}</p>
                                </div>
                                <span class="font-overpass text-[#C1A0AC] text-xs font-semibold mt-2">${gift.orderNum}</span>
                            </div>
                            <div class="border-t border-dashed border-[#806C79]/40 pt-3 space-y-2">
                                <div>
                                    <p class="font-overpass text-[9px] uppercase text-[#C1A0AC] font-bold tracking-widest">Película</p>
                                    <p class="font-cormorant text-xl font-bold text-[#F0D9E4] leading-tight">${gift.movie}</p>
                                </div>
                                <div class="grid grid-cols-2 gap-2 pt-1">
                                    <div>
                                        <p class="font-overpass text-[9px] uppercase text-[#C1A0AC] font-bold tracking-widest">Fecha y Hora</p>
                                        <p class="font-andika text-xs font-normal text-[#F0D9E4]">${gift.dateTime}</p>
                                    </div>
                                    <div>
                                        <p class="font-overpass text-[9px] uppercase text-[#C1A0AC] font-bold tracking-widest">Cine</p>
                                        <p class="font-andika text-xs font-normal text-[#F0D9E4]">${gift.cinema}</p>
                                    </div>
                                </div>
                                <div class="pt-1">
                                    <p class="font-overpass text-[9px] uppercase text-[#C1A0AC] font-bold tracking-widest">Asientos & Sala</p>
                                    <p class="font-overpass text-xs font-bold text-[#F0D9E4]">${gift.seats}</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (gift.type === "spotify") {
                    document.getElementById('modal-body').innerHTML = `
                        <p class="font-andika text-[#F0D9E4]/80 text-xs mb-4">${gift.message}</p>
                        <div class="w-full rounded-2xl overflow-hidden shadow-2xl border border-[#806C79]/40">
                            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/${gift.spotifyId}?utm_source=generator&theme=0" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                        </div>
                    `;
                } else if (gift.type === "coupon") {
                    document.getElementById('modal-body').innerHTML = `
                        <p class="font-andika text-[#F0D9E4]/80 text-xs mb-4">${gift.message}</p>
                        <div class="bg-gradient-to-br from-[#16131F] via-[#4A3F4B]/80 to-[#16131F] border-2 border-dashed border-[#C1A0AC]/50 rounded-2xl p-5 shadow-2xl text-center relative overflow-hidden my-3">
                            <div class="font-overpass text-[10px] font-extrabold text-[#C1A0AC] tracking-widest uppercase mb-1">${gift.couponSubtitle}</div>
                            <h4 class="font-cormorant text-2xl font-bold text-[#F0D9E4] mb-3">${gift.couponTitle}</h4>
                            
                            <div class="bg-[#16131F]/80 border border-[#806C79]/30 rounded-xl p-3 mb-4 backdrop-blur-sm">
                                <p class="font-andika text-xs text-[#F0D9E4]/90 leading-relaxed">
                                    ${gift.couponBody}
                                </p>
                            </div>

                            <div class="flex items-center justify-between border-t border-[#806C79]/30 pt-3 text-left text-xs">
                                <div>
                                    <p class="font-overpass text-[9px] text-[#C1A0AC] uppercase font-bold tracking-wider">Válido para:</p>
                                    <p class="font-andika font-normal text-[#F0D9E4]">Dani (Osita Mosha)</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-overpass text-[9px] text-[#C1A0AC] uppercase font-bold tracking-wider">Código:</p>
                                    <p class="font-mono font-bold text-[#F0D9E4]">${gift.couponCode}</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (gift.type === "letter") {
                    document.getElementById('modal-body').innerHTML = `
                        <div class="bg-gradient-to-b from-[#16131F]/90 via-[#4A3F4B]/50 to-[#16131F]/90 border border-[#806C79]/40 rounded-2xl p-5 sm:p-6 text-left shadow-2xl relative my-2 backdrop-blur-md">
                            <h4 class="font-cormorant text-lg sm:text-xl italic font-bold text-[#F0D9E4] mb-4 border-b border-[#806C79]/30 pb-2">${gift.letterTitle}</h4>
                            <p class="font-andika text-xs text-[#F0D9E4]/90 leading-relaxed">${gift.letterBody}</p>
                            <div class="font-cormorant text-right italic font-bold text-[#C1A0AC] text-sm sm:text-base mt-6 pt-3 border-t border-[#806C79]/30">
                                ${gift.letterSign}
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('modal-body').innerText = gift.message;
                }
            } else {
                document.getElementById('modal-icon').innerText = "🔒";
                document.getElementById('modal-title').innerText = "¡Aún no es el momento!";
                document.getElementById('modal-date').innerText = "Disponible el " + gift.dayName;
                document.getElementById('modal-body').innerText = `Este regalo estará disponible el ${gift.dayName}. ¡Ten paciencia, falta muy poco! ✦`;
            }

            modal.classList.remove('hidden');
        }

        document.getElementById('close-modal').addEventListener('click', () => modal.classList.add('hidden'));
        document.getElementById('modal-btn').addEventListener('click', () => {
            modal.classList.add('hidden');
            triggerConfetti();
        });

        renderGifts();
    </script>
</body>
</html>
